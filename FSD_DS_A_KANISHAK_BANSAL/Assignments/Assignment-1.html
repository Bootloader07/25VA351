<!DOCTYPE html>
<html>

<head>
    <title>Simple Quiz</title>
    <link rel="stylesheet" href="Assignment1.css">
</head>

<body>
    <div class="container">
        <div id="startPage">
            <h1>Simple Quiz</h1> <input type="text" id="name" placeholder="Enter Name"> <input type="text" id="roll"
                placeholder="Enter Roll No"> <input type="text" id="section" placeholder="Enter Section"> <button
                onclick="startQuiz()">Start Quiz</button>
        </div>
        <div id="quizPage" style="display:none;">
            <h2 id="questionNumber"></h2>
            <p id="timer">Time: 30</p>
            <h3 id="question"></h3>
            <div id="options"></div> <br> <button onclick="nextQuestion()">Next</button> <button
                onclick="submitQuiz()">Submit</button>
        </div>
        <div id="resultPage" style="display:none;">
            <h1>Quiz Result</h1>
            <p id="studentInfo"></p>
            <h2 id="score"></h2> <button onclick="location.reload()">Restart Quiz</button>
        </div>
    </div>
    <script src="Assignment-1.js"></script>
</body>

</html>
